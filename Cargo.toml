[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/world-def",
    "crates/generators",
    "crates/cache",
    "crates/streaming",
    "crates/frame",
    "crates/render",
    "crates/editor",
    "crates/app",
    "crates/testkit",
    "crates/perf",
    "xtask",
]
default-members = [
    "crates/core",
    "crates/world-def",
    "crates/generators",
    "crates/cache",
    "crates/streaming",
    "crates/frame",
    "crates/render",
    "crates/editor",
    "crates/app",
    "crates/testkit",
    "crates/perf",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.89"

[workspace.dependencies]
libm = "=0.2.16"
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl", "dx12", "vulkan"] }
pollster = "1.0.1"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11"] }
raw-window-handle = { version = "=0.6.2", features = ["std"] }
png = "0.18.1"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }

planet-core = { path = "crates/core" }
planet-world-def = { path = "crates/world-def" }
planet-generators = { path = "crates/generators" }
planet-cache = { path = "crates/cache" }
planet-streaming = { path = "crates/streaming" }
planet-frame = { path = "crates/frame" }
planet-render = { path = "crates/render" }
planet-editor = { path = "crates/editor" }
planet-testkit = { path = "crates/testkit" }
planet-perf = { path = "crates/perf" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"  # SPIKE-15 variant A

[profile.dev.package."*"]
opt-level = 2
debug = false  # SPIKE-15 variant A

# Math and noise stay fast in the dev profile (report §16 build-speed measures).
[profile.dev.package.planet-core]
opt-level = 3

[profile.dev.package.planet-frame]
opt-level = 3

[profile.dev.package.planet-generators]
opt-level = 3
