# Look review 2, hills site, default look: the poses of look-review-1-hills on the rebuilt store (m8-driver-maps).
# Run: cargo xtask capture stills --poses docs/milestones/M8/look-review-2-hills/default/poses.toml --store target/accept/global16384 --out-dir docs/milestones/M8/look-review-2-hills/default
chunk_timeout_s = 3600

[place]
anchor = "steepest-river"
slope_radius_m = 2000
min_area_m2 = 1e10
snap_to_channel_m = 1200

[[pose]]
name = "300m-sunset"
altitude_m = 300
back_m = 1500
heading_deg = 0
pitch_deg = 15
sun_local_hours = 17.5

[[pose]]
name = "300m-midday"
altitude_m = 300
back_m = 1500
heading_deg = 0
pitch_deg = 15
sun_local_hours = 12

