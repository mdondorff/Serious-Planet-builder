# The poses of look review 1 (M8-4; docs/briefings/m8-plan.md, exit criterion 1): 300 m, 30 m and 1.8 m over the largest river of the
# coupled run, at sunset and at midday. Run: cargo xtask capture stills --poses docs/milestones/M8/look-review-1/poses.toml --store DIR
# The sun is local solar time at the eye (12 is noon; 17.5 is 7.5 degrees over the horizon at the equinox). The heading is degrees
# clockwise from north; the eye stands back_m behind the anchor against it, altitude_m over the ground.

chunk_timeout_s = 3600

[place]
anchor = "largest-river"

[[pose]]
name = "300m-sunset"
altitude_m = 300
back_m = 1500
heading_deg = 0
pitch_deg = 15
sun_local_hours = 17.5

[[pose]]
name = "300m-midday"
altitude_m = 300
back_m = 1500
heading_deg = 0
pitch_deg = 15
sun_local_hours = 12

[[pose]]
name = "30m-sunset"
altitude_m = 30
back_m = 400
heading_deg = 0
pitch_deg = 8
sun_local_hours = 17.5

[[pose]]
name = "30m-midday"
altitude_m = 30
back_m = 400
heading_deg = 0
pitch_deg = 8
sun_local_hours = 12

[[pose]]
name = "1.8m-sunset"
altitude_m = 1.8
back_m = 60
heading_deg = 0
pitch_deg = 0
sun_local_hours = 17.5

[[pose]]
name = "1.8m-midday"
altitude_m = 1.8
back_m = 60
heading_deg = 0
pitch_deg = 0
sun_local_hours = 12
