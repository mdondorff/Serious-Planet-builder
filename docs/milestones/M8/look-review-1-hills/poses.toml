# The poses of look review 1, second site (M8-3 hills): the six poses of look-review-1 over the largest river of the coupled run in hilly ground.
# The anchor is the land river cell at least 150 m high with the largest drainage area among the cells whose surroundings within 20 km span
# 1000 to 2500 m of coupled-run height (relief_radius_m, relief_min_m, relief_max_m). Heading 267 is the river's flow there (looking downstream).
# Run: cargo xtask capture stills --poses docs/milestones/M8/look-review-1-hills/poses.toml --store DIR

chunk_timeout_s = 3600

[place]
anchor = "largest-river"
min_height_m = 150   # inland, off the river mouths
relief_radius_m = 20000
relief_min_m = 1000
relief_max_m = 2500

[[pose]]
name = "300m-sunset"
altitude_m = 300
back_m = 1500
heading_deg = 267
pitch_deg = 15
sun_local_hours = 17.5

[[pose]]
name = "300m-midday"
altitude_m = 300
back_m = 1500
heading_deg = 267
pitch_deg = 15
sun_local_hours = 12

[[pose]]
name = "30m-sunset"
altitude_m = 30
back_m = 400
heading_deg = 267
pitch_deg = 8
sun_local_hours = 17.5

[[pose]]
name = "30m-midday"
altitude_m = 30
back_m = 400
heading_deg = 267
pitch_deg = 8
sun_local_hours = 12

[[pose]]
name = "1.8m-sunset"
altitude_m = 1.8
back_m = 60
heading_deg = 267
pitch_deg = 0
sun_local_hours = 17.5

[[pose]]
name = "1.8m-midday"
altitude_m = 1.8
back_m = 60
heading_deg = 267
pitch_deg = 0
sun_local_hours = 12
