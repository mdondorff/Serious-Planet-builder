# Look review 2b, default look. Look review 1 river site at its exact coordinates (README of look-review-1: latitude -11.1657, longitude 23.0493), looking along its downstream bearing 131.
# Run: cargo xtask capture stills --poses docs/milestones/M8/look-review-2b/river-r1/default/poses.toml --store target/accept/global16384 --out-dir docs/milestones/M8/look-review-2b/river-r1/default

chunk_timeout_s = 3600

[place]
lat = -11.1657
lon = 23.0493

[[pose]]
