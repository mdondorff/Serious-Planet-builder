# Look review 2b, default look. Look review 1 hills site at its exact snapped coordinates (README of look-review-1-hills: latitude -37.6958, longitude 3.1397), looking along its downstream bearing 145.
# Run: cargo xtask capture stills --poses docs/milestones/M8/look-review-2b/hills-r1/default/poses.toml --store target/accept/global16384 --out-dir docs/milestones/M8/look-review-2b/hills-r1/default

chunk_timeout_s = 3600

[place]
lat = -37.6958
lon = 3.1397

[[pose]]
name = "300m-sunset"
