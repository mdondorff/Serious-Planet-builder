# A test that blocks (for example a deadlocked pool) must fail, not stall CI.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# Declared limit (approved by the planner, 2026-10-29). `gpu_window::the_window_path_opens_runs_the_flight_lit_with_the_atmosphere_and_closes` opens the
# window on the default 256-cell world twice at once (a plain run and a look-file run), and is the one test that does. On the Windows CI runner it
# took 162 s, 250 s and 262 s in three runs, 142 s of the last one in the floor tiles of the default bake (`TIMING` of #881); the limit of the
# `gpu_` tier (300 s) is 15 % over the slowest. A declared 450 s (5 x 90 s) is the slowest seen plus 70 %: it still catches a hang. The first
# matching override sets a value, so this one comes before the `gpu_` one. No test is skipped, retried or changed.
[[profile.default.overrides]]
filter = 'binary(gpu_all) and test(the_window_path_opens_runs_the_flight_lit_with_the_atmosphere_and_closes)'
slow-timeout = { period = "90s", terminate-after = 5 }

# Declared limit (approved by the planner, 2026-10-29, BUILD-003). `gpu_water::a_coastal_flight_at_low_altitude_flickers_within_the_budget_while_the_lod_changes_under_it`
# flies a coastal descent on the lit path and is the last test of the Windows CI partition `C 1/2`, running alone. Its durations on the Windows CI
# runner: 95.7 s (#887), 180.0 s (#888), then more than 300 s in three runs of #889 (300.2 s, 300.1 s, 300.1 s, the limit of the `gpu_` tier), while the
# rest of that partition passed. A declared 450 s (5 x 90 s) is the limit that is not a budget: it still catches a hang. The first matching override
# sets a value, so this one comes before the `gpu_` one. No test is skipped, retried or changed.
[[profile.default.overrides]]
filter = 'binary(gpu_all) and test(a_coastal_flight_at_low_altitude_flickers_within_the_budget_while_the_lod_changes_under_it)'
slow-timeout = { period = "90s", terminate-after = 5 }

# Declared limit (approved by the planner, 2026-10-29, BUILD-003). `gpu_lit_stream_flicker::the_lit_coast_view_over_streamed_tiles_draws_the_same_pixels_still_and_after_a_small_turn_and_back`
# (TEST-070) draws the lit coast view with the streaming loop and settles three times. It does not hang: on the Windows CI runner it was cut off at
# 300.2 s, 300.3 s and 300.3 s while progressing. Phase times of the last cut-off run (progress lines of the test): streaming settle 213.8 s (291 ticks;
# 76.4 s and 88 ticks on the throttled laptop, whose local run takes 188 s in all), exposure 2.5 s, 6 frames 8.1 s, turn settle 17.7 s, exposure 2.4 s,
# and the back settle and exposure still to come at about 20 s each. A declared 450 s (5 x 90 s) is the cut-off plus 50 %: it still catches a hang (every
# settle fails with numbers after 900 ticks). The first matching override sets a value, so this one comes before the `gpu_` one. No test is skipped,
# retried or changed.
[[profile.default.overrides]]
filter = 'binary(gpu_all) and test(the_lit_coast_view_over_streamed_tiles_draws_the_same_pixels_still_and_after_a_small_turn_and_back)'
slow-timeout = { period = "90s", terminate-after = 5 }

# Declared limit (approved by the planner, 2026-11-01, BUILD-003; SPIKE-84). `gpu_edit_perf::the_edit_latency_scene_runs_end_to_end_in_smoke_mode_and_prints_its_table`
# runs the edit-latency scene end to end in smoke mode. On the Windows CI runner (WARP, partition `C 1/2`) it was cut off at the 300 s limit of the
# `gpu_` tier in 22 runs between 2026-10-19 and 2026-10-25 and passed on re-run (39413040398, 39404054677): runner load, not a hang. A declared 450 s
# (5 x 90 s) still catches a hang. The first matching override sets a value, so this one comes before the `gpu_` one. No test is skipped, retried or changed.
[[profile.default.overrides]]
filter = 'binary(gpu_all) and test(the_edit_latency_scene_runs_end_to_end_in_smoke_mode_and_prints_its_table)'
slow-timeout = { period = "90s", terminate-after = 5 }

# Declared limit (approved by the planner, 2026-11-01, BUILD-003; SPIKE-84). `gpu_stills::the_stills_scene_draws_each_pose_with_its_horizon_maps_baked`
# draws every pose of the stills scene. On the Windows CI runner (WARP, partition `C 2/2`) it was cut off at 300 s in 15 runs (under its former name
# `…_with_its_chunks_landed…`) and passed on re-run (40234157047, 40217219666). A declared 450 s (5 x 90 s) still catches a hang. The first matching
# override sets a value, so this one comes before the `gpu_` one. No test is skipped, retried or changed.
[[profile.default.overrides]]
filter = 'binary(gpu_all) and test(the_stills_scene_draws_each_pose_with_its_horizon_maps_baked)'
slow-timeout = { period = "90s", terminate-after = 5 }

# The software-adapter GPU tier (BUILD-003): the heavy `gpu_*` tests take 40 to 66 s alone and up to 144 s beside the other processes of
# a full `cargo xtask test gpu` (about 20 at once, each software rasteriser multi-threaded), so they reach the 120 s mark of the default
# limit. The limit is there to catch a hang, not to budget a test: these binaries terminate after 300 s (5 x 60 s). Grouping the heavy
# tests did not shorten the run (the run is 182 s; groups of 4 and 6 gave 190 to 250 s). No test is skipped, retried or changed.
[[profile.default.overrides]]
filter = 'binary(/^gpu_/)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The tier-A tests that take longest start first, so that they do not run last and alone (the tail of `cargo xtask test fast`,
# TEST-001 budget). A start order only: no test is skipped, retried or changed. `cargo xtask test fast` prints the slowest five.
[[profile.default.overrides]]
filter = '''
test(a_cut_tile_has_no_vertex_inside_the_frustum)
or test(camera_is_above_the_drawn_surface_in_every_scripted_view_on_the_steep_field)
or test(the_slots_every_standard_view_needs_stay_within_their_pins_and_the_share)
or test(resident_bytes_never_exceed_the_budget_and_reads_stay_exact)
or test(tiles_over_the_store_are_identical_at_1_and_3_threads_and_to_the_in_memory_bake)
or test(a_share_smaller_than_r_keeps_the_view_exact_and_the_slots_inside_the_share)
or test(every_standard_view_of_the_default_world_stays_within_its_own_pinned_counts)
'''
priority = 50

# `cargo xtask test fast` reads this to print the slowest tests (TEST-001 budget guard).
[profile.default.junit]
path = "junit.xml"

# `cargo xtask test gpu --real` runs the GPU tests on the discrete GPU under this profile (BUILD-003). nextest starts one process per
# test, as many as there are cores (about 20 on Rasierklinge); that many processes on one device lost it ("wgpu device lost
# (Unknown)"). xtask caps the processes at `REAL_GPU_THREADS` (`--test-threads`) and the heavy binaries share a smaller group below.
# Only the start order and the overlap change: no test is skipped, retried or changed, and the software and WARP runs keep the
# default profile.
[test-groups]
real-gpu-heavy = { max-threads = 2 }
heavy-window = { max-threads = 2 }
gpu-tier = { max-threads = 8 }

[profile.real-gpu]
inherits = "default"

[profile.real-gpu.junit]
path = "junit.xml"

[[profile.real-gpu.overrides]]
filter = '''
(package(=planet-render) and binary(gpu_all) and test(/^(gpu_lit|gpu_water|gpu_atmosphere|gpu_compact_blocks)::/))
or (package(=planet-render) and binary(oracle_all) and test(/^oracle_lit::/))
or (package(=planet) and binary(gpu_all) and test(/^(gpu_water_coverage|gpu_stream_perf|gpu_flight|gpu_world_field)::/))
or (package(=planet-cache) and binary(oracle_all) and test(/^oracle_concurrent_source::/))
'''
test-group = "real-gpu-heavy"

# The heavy software-adapter window and scene tests (the tracked tier-C timeouts: `gpu_window`, `gpu_water_coverage`, `gpu_stream_perf`,
# `gpu_envelope_perf`) are CPU-bound (each software rasteriser uses every core) and their wall time swings 2 to 5 times with how many of them run
# beside each other: the same sweep took 72 s in one job of one CI run and 215 s in the other (`TIMING` of #881 and #883, Windows WARP, 4 threads).
# They share a group that runs at most 2 at once; the lighter tests still fill the other threads. Only the overlap changes: no test is skipped,
# retried or changed (the planner's proposal, 2026-10-29; CI is the judge of what it does to the per-test and the job time). Joined 2026-11-01
# (BUILD-003; SPIKE-84): `gpu_edit_perf`, `gpu_stills` and the three `gpu_skeleton` loop tests, which timed out under the same load on WARP CI
# (37 runs in 14 days) and locally (2026-10-31).
[[profile.default.overrides]]
filter = 'binary(gpu_all) and (test(/^gpu_window::/) or test(/^gpu_water_coverage::/) or test(/^gpu_stream_perf::/) or test(/^gpu_envelope_perf::/) or test(/^gpu_edit_perf::/) or test(/^gpu_stills::/) or test(the_pipelined_loop_settles_on_the_synchronous_frame_from_a_cold_start_and_after_a_jump) or test(the_draw_flag_selects_the_path_and_every_loop_draws_the_same_frame_on_either) or test(the_upload_flag_selects_the_write_path_and_the_batched_loop_draws_the_same_frames_in_fewer_calls))'
test-group = "heavy-window"

# The software GPU tier runs at most 8 `gpu_*` tests at once (BUILD-003; SPIKE-84); every `gpu_*` test lives in a `gpu_all` binary (BUILD-015).
# A local software `test gpu` started about 20 rasterising processes on the 20-thread reference laptop: the 12 timeouts of 2026-10-20 and the 3
# `gpu_skeleton` timeouts of 2026-10-31 came from that load. A test the override above puts in `heavy-window` stays there (the first matching
# override sets the group). Tier A and B are not capped; a machine with 8 cores or fewer (CI's runners) runs as before. No test is skipped,
# retried or changed.
[[profile.default.overrides]]
filter = 'binary(gpu_all)'
test-group = "gpu-tier"
