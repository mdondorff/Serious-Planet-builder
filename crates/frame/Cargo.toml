[package]
name = "planet-frame"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# One test binary per tier (SPIKE-15 step 3, BUILD-015): `it` (tier A) and `oracle_all` (tier B) include the test files as modules.
# A new test file is added to the aggregator of its tier (a file in `tests/` that no aggregator names is never compiled).
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "oracle_all"
path = "tests/oracle_all.rs"

[dependencies]
planet-core.workspace = true
planet-world-def.workspace = true
planet-streaming.workspace = true
planet-generators.workspace = true
libm.workspace = true
toml.workspace = true

[dev-dependencies]
planet-cache.workspace = true
planet-generators = { workspace = true, features = ["stress"] }
