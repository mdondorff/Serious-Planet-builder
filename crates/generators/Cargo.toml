[package]
name = "planet-generators"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# One test binary per tier (SPIKE-15 step 3, BUILD-015): `it` (tier A) and `oracle_all` (tier B) include the test files as modules.
# A new test file is added to the aggregator of its tier (a file in `tests/` that no aggregator names is never compiled).
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "oracle_all"
path = "tests/oracle_all.rs"

[dependencies]
planet-core.workspace = true
planet-world-def.workspace = true
png.workspace = true
libm.workspace = true

[features]
# Test-only stress terrain (`stress::Steep`, TEST-015). Enabled only through dev-dependencies, never in a product build.
stress = []

[dev-dependencies]
planet-generators = { path = ".", features = ["stress"] }
