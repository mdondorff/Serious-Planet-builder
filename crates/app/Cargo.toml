[package]
name = "planet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "planet"
path = "src/main.rs"

[dependencies]
planet-core.workspace = true
planet-world-def.workspace = true
planet-generators.workspace = true
planet-cache.workspace = true
planet-streaming.workspace = true
planet-frame.workspace = true
planet-render.workspace = true
planet-editor.workspace = true
planet-perf.workspace = true

[dev-dependencies]
planet-testkit.workspace = true

[features]
# SPIKE-06 measurement example (`cargo run --release -p planet --features spike06 --example compact_tile`).
spike06 = ["planet-render/spike06"]

[[example]]
name = "compact_tile"
required-features = ["spike06"]
