[package]
name = "planet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# One test binary per tier (SPIKE-15 step 3, BUILD-015): `it` (tier A), `oracle_all` (tier B) and `gpu_all` (tier C) include the test
# files as modules. A new test file is added to the aggregator of its tier (a file in `tests/` that no aggregator names is never compiled).
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "oracle_all"
path = "tests/oracle_all.rs"

[[test]]
name = "gpu_all"
path = "tests/gpu_all.rs"

[[bin]]
name = "planet"
path = "src/main.rs"

[dependencies]
planet-core.workspace = true
planet-world-def.workspace = true
planet-generators.workspace = true
planet-cache.workspace = true
planet-streaming.workspace = true
planet-frame.workspace = true
planet-render.workspace = true
planet-editor.workspace = true
planet-perf.workspace = true
libm.workspace = true
winit.workspace = true
egui.workspace = true
egui-winit.workspace = true

[dev-dependencies]
planet-testkit.workspace = true
# The flight differential draws the same plans with the test-only reference renderer (REND-031).
planet-render = { workspace = true, features = ["reference-renderer"] }

[features]
# SPIKE-07 measurement example (`cargo run --release -p planet --features spike07 --example finest_level`).
spike07 = ["planet-render/spike07"]

[[example]]
name = "finest_level"
required-features = ["spike07"]
