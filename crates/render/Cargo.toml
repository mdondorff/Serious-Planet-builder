[package]
name = "planet-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# One test binary per tier (SPIKE-15 step 3, BUILD-015): `it` (tier A), `oracle_all` (tier B) and `gpu_all` (tier C) include the test
# files as modules. A new test file is added to the aggregator of its tier (a file in `tests/` that no aggregator names is never compiled).
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "oracle_all"
path = "tests/oracle_all.rs"

[[test]]
name = "gpu_all"
path = "tests/gpu_all.rs"

[dependencies]
planet-core.workspace = true
planet-frame.workspace = true
planet-streaming.workspace = true
wgpu.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
png.workspace = true

planet-generators.workspace = true

[dev-dependencies]
planet-generators = { workspace = true, features = ["stress"] }
planet-testkit.workspace = true
planet-world-def.workspace = true
libm.workspace = true
# Test builds enable the test-only reference renderer (REND-031); no non-dev dependency edge may.
planet-render = { workspace = true, features = ["reference-renderer"] }

[features]
# The test-only reference renderer (ADR 0062 point 1, REND-031): a minimal debug-view renderer from CPU meshes, the independent reference of the
# compact renderer's image tests. Off by default; only dev-dependencies enable it, and `cargo xtask layering` enforces that.
reference-renderer = []
