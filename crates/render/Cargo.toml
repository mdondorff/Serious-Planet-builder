[package]
name = "planet-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
planet-core.workspace = true
planet-frame.workspace = true
planet-streaming.workspace = true
wgpu.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
png.workspace = true

planet-generators.workspace = true

[dev-dependencies]
planet-generators = { workspace = true, features = ["stress"] }
planet-testkit.workspace = true
planet-world-def.workspace = true
libm.workspace = true
# Test builds enable the test-only reference renderer (REND-031); no non-dev dependency edge may.
planet-render = { workspace = true, features = ["reference-renderer"] }

[features]
# SPIKE-06 (docs/archive/M4/spikes.md): experimental compact tile format (shared grid, per-tile height and normal texels). Not part of
# the product: off by default, never enabled by another crate's default features.
spike06 = []
# SPIKE-07 (docs/archive/M4/spikes.md): experimental shader detail term below the finest geometry level (visual only). Not part of the
# product: off by default, never enabled by another crate's default features.
spike07 = []
# The test-only reference renderer (ADR 0062 point 1, REND-031): a minimal debug-view renderer from CPU meshes, the independent reference of the
# compact renderer's image tests. Off by default; only dev-dependencies enable it, and `cargo xtask layering` enforces that.
reference-renderer = []
