[package]
name = "planet-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
planet-core.workspace = true
planet-frame.workspace = true
planet-streaming.workspace = true
wgpu.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
png.workspace = true

planet-generators.workspace = true

[dev-dependencies]
planet-generators = { workspace = true, features = ["stress"] }
planet-testkit.workspace = true
libm.workspace = true

[features]
# SPIKE-06 (docs/archive/M4/spikes.md): experimental compact tile format (shared grid, per-tile height and normal texels). Not part of
# the product: off by default, never enabled by another crate's default features.
spike06 = []
# SPIKE-07 (docs/archive/M4/spikes.md): experimental shader detail term below the finest geometry level (visual only). Not part of the
# product: off by default, never enabled by another crate's default features.
spike07 = []
