[package]
name = "planet-streaming"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# One test binary per tier (SPIKE-15 step 3, BUILD-015): `it` (tier A) includes the test files as modules.
# A new test file is added to the aggregator of its tier (a file in `tests/` that no aggregator names is never compiled).
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
planet-core.workspace = true
planet-cache.workspace = true
planet-generators.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
planet-generators = { workspace = true, features = ["stress"] }
