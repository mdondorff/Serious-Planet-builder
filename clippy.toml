# COORD-009 (ADR 0010): platform transcendentals differ between libms; use `libm` for anything that feeds generated data.
# sqrt, floor, ceil, abs and the other IEEE-exact operations stay allowed. A test or tool that needs one of these
# deliberately must say so with #[allow(clippy::disallowed_methods)] and a reason.
